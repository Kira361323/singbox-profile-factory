name: build-profiles

on:
  push:
    paths:
      - providers.json
      - subscriptions.md
      - scripts/**
      - templates/**
      - .github/workflows/build-profiles.yml
  schedule:
    - cron: "25 */6 * * *"
  workflow_dispatch:
    inputs:
      max_links:
        description: "Override max links for all sources. Empty = use providers/default."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-profiles
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sing-box
        env:
          SING_BOX_TAG: ${{ vars.SING_BOX_TAG || 'latest' }}
        run: |
          set -euo pipefail

          if [ "$SING_BOX_TAG" = "latest" ]; then
            REL_URL="https://api.github.com/repos/SagerNet/sing-box/releases/latest"
          else
            REL_URL="https://api.github.com/repos/SagerNet/sing-box/releases/tags/${SING_BOX_TAG}"
          fi

          REL=$(curl -fsSL "$REL_URL")

          SB_VER=$(echo "$REL" | jq -r .tag_name | sed 's/^v//')

          ASSET=$(echo "$REL" | jq -r '.assets[].browser_download_url
            | select(contains("linux-amd64") and endswith(".tar.gz"))' | head -1)

          if [ -z "$ASSET" ]; then
            echo "sing-box asset not found" >&2
            echo "Available assets:" >&2
            echo "$REL" | jq -r '.assets[].name' >&2 || true
            exit 1
          fi

          echo "sing-box version: ${SB_VER}"
          echo "Downloading asset: ${ASSET}"

          TMP_DIR=$(mktemp -d)
          curl -fsSL "$ASSET" | tar xz -C "$TMP_DIR"

          echo "Archive contents:"
          find "$TMP_DIR" -maxdepth 3 -print

          SB_BIN=$(find "$TMP_DIR" -type f -name sing-box -print -quit)

          if [ -z "$SB_BIN" ]; then
            echo "sing-box binary not found inside archive" >&2
            exit 1
          fi

          chmod +x "$SB_BIN"
          sudo install "$SB_BIN" /usr/local/bin/sing-box

          sing-box version

      - name: Setup Node
        uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: 24

      - name: Install optional Node singbox-converter
        continue-on-error: true
        shell: bash
        run: |
          set +e

          npm init -y >/dev/null 2>&1

          npm install singbox-converter >/dev/null 2>&1

          if [ $? -ne 0 ]; then
            echo "npm install singbox-converter failed, trying GitHub repo"
            npm install github:OpexDevelop/singbox-converter >/dev/null 2>&1
          fi

          node -e "import('singbox-converter').then(()=>process.exit(0)).catch(()=>process.exit(1))" >/dev/null 2>&1

          if [ $? -eq 0 ]; then
            echo "Node singbox-converter available"
          else
            echo "Node singbox-converter unavailable, Python converter will be used"
          fi

      - name: Build profiles
        env:
          FORCE_MAX_LINKS: ${{ github.event.inputs.max_links || '' }}
          MAX_LINKS: ${{ vars.MAX_LINKS || '300' }}
          DEFAULT_UA: ${{ vars.DEFAULT_UA || 'clash.meta' }}
          DEFAULT_TEMPLATE: ${{ vars.DEFAULT_TEMPLATE || 'templates/base.json' }}
          PRUNE_INVALID: ${{ vars.PRUNE_INVALID || '1' }}
        run: |
          bash scripts/convert.sh

      - name: Commit profiles
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profiles/

          if git diff --cached --quiet; then
            echo "No profile changes"
          else
            git commit -m "profiles: $(date -u +%Y-%m-%d_%H:%M)"
            git push
          fi
